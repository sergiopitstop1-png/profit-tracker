<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cruciverba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#0b0e1f;--panel:#1b2040;--line:#2d3466;--text:#f4efe4;--muted:#a3a9d4;--amber:#ffb454;
  --cell:#f4efe4;--ink:#161a35;--black:#0b0e1f;--sel:#ffd98a;--word:#cfd6ff;--bad:#ff6b6b;--ok:#6be3a0;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.shell{max-width:1040px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.05}
.tag{color:var(--muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
button{font:inherit;color:inherit}
.btn{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.88rem;cursor:pointer;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:#2a1a05;border-color:var(--amber)}
.btn:focus-visible,.cell:focus-visible,.key:focus-visible,.clue:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:7px 14px;font-weight:800;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--amber);color:#2a1a05}
.stats{color:var(--muted);font-size:.82rem}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.main{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.now{min-height:2.6em;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.now b{color:var(--amber);font-family:var(--font-display);font-size:1.05rem;white-space:nowrap}
.gridwrap{position:relative;width:100%;max-width:560px;margin:0 auto}
.grid{display:grid;gap:0;border:2px solid var(--black);background:var(--black);width:100%;aspect-ratio:1/1;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cell{position:relative;background:var(--cell);color:var(--ink);border:0;outline:1px solid #8b90b8;outline-offset:-0.5px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;cursor:pointer;padding:0;border-radius:0;min-width:0;min-height:0;overflow:hidden;container-type:size}
.cell.blk{background:var(--black);outline-color:var(--black);cursor:default}
.cell.inword{background:var(--word)}
.cell.sel{background:var(--sel)}
.cell .n{position:absolute;left:2px;top:0;font-size:min(30cqh,.62rem);font-weight:700;line-height:1.1;color:#44497a;font-family:var(--font-body)}
.cell .l{font-size:62cqh;line-height:1}
.cell.bad{background:#ffc9c9}.cell.bad .l{color:#b3202a}
.cell.good .l{color:#0d7a45}
.cell.hint .l{color:#7a4a00}
.kb{display:none;flex-direction:column;gap:5px;margin-top:2px}
.kb .row{display:flex;gap:4px;justify-content:center}
.key{flex:1 1 0;max-width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-family:var(--font-display);font-weight:800;font-size:1.05rem;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.key.wide{max-width:64px;font-size:.85rem}
.key:active{background:var(--amber);color:#2a1a05}
@media (pointer:coarse){.kb{display:flex}}
.right{display:grid;grid-template-columns:1fr;gap:12px;min-width:0}
@media (min-width:560px) and (max-width:899px){.right{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.right{grid-template-columns:1fr 1fr}}
.list h2{margin:0 0 4px;font-family:var(--font-display);font-size:1.05rem;color:var(--amber)}
.list ol{list-style:none;margin:0;padding:0;font-size:.92rem}
.clue{display:flex;gap:8px;padding:3px 8px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.clue:hover{background:var(--panel)}
.clue.cur{background:var(--panel);outline:1px solid var(--amber)}
.clue.done{color:var(--muted);text-decoration:line-through}
.clue .num{min-width:1.6em;font-weight:800;color:var(--amber)}
.clue .len{color:var(--muted);font-size:.8em;white-space:nowrap}
.overlay{position:absolute;inset:0;background:rgba(8,10,28,.88);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;z-index:3}
.overlay[hidden]{display:none}
.overlay p{margin:6px 0 0;color:var(--muted)}
.overlay h2{margin:0;font-family:var(--font-display);color:var(--amber)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.printhead{display:none}
@media print{
  :root{color-scheme:light}
  body{background:#fff;color:#000}
  .shell{max-width:none;padding:0}
  header,.bar,.now,.kb,.stats,.noprint{display:none!important}
  .printhead{display:block;font-family:var(--font-display);font-size:20pt;font-weight:800;margin:0 0 6pt}
  .main{display:block}
  .gridwrap{max-width:15cm;margin:0}
  .cell{background:#fff!important;color:#000}.cell.blk{background:#000!important}
  .cell .n{color:#000}.cell .l{visibility:hidden}
  body.solved .cell .l{visibility:visible}
  .right{display:grid;grid-template-columns:1fr 1fr;gap:10pt;margin-top:10pt}
  .list h2{color:#000}.clue{color:#000;padding:1pt 0;font-size:9.5pt;break-inside:avoid}.clue .num{color:#000}.clue.done{text-decoration:none;color:#000}.clue.cur{outline:0;background:none}
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="tag">Enigmistica</div><h1>Cruciverba</h1></div>
    <a class="btn" href="#" id="home">← Giochi</a>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Dimensione">
      <button data-n="9" aria-pressed="false">9×9</button>
      <button data-n="11" aria-pressed="true">11×11</button>
      <button data-n="13" aria-pressed="false">13×13</button>
    </div>
    <button class="btn primary" id="new">Nuovo schema</button>
    <button class="btn" id="check">Verifica</button>
    <button class="btn" id="hint">Aiuto lettera</button>
    <button class="btn" id="solve">Soluzione</button>
    <button class="btn" id="clear">Svuota</button>
    <button class="btn" id="print">Stampa</button>
  </div>
  <div class="stats" id="stats">&nbsp;</div>
  <div class="printhead" id="printhead">Cruciverba</div>
  <div class="main">
    <div class="left">
      <div class="now" id="now" aria-live="polite"><b>—</b><span>Scegli una casella</span></div>
      <div class="gridwrap">
        <div class="grid" id="grid" role="application" aria-label="Griglia del cruciverba"></div>
        <div class="overlay" id="busy"><div><div class="spin"></div><h2>Sto creando lo schema…</h2><p id="busyinfo">Un attimo di pazienza</p></div></div>
      </div>
      <div class="kb" id="kb"></div>
    </div>
    <div class="right">
      <div class="list"><h2>Orizzontali</h2><ol id="across"></ol></div>
      <div class="list"><h2>Verticali</h2><ol id="down"></ol></div>
    </div>
  </div>
</div>

<script type="text/plain" id="cwsrc">/* Generatore di cruciverba: griglie simmetriche con poche caselle nere + riempimento a vincoli.
   Funziona sia in Node che nel browser. */
(function (root) {
  'use strict';

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- Schema di base ---------- */
  // black: array N*N di 0/1. Regole: simmetria di 180 gradi, ogni serie di bianche lunga almeno 3 (cioe' tutte le
  // caselle sono incrociate), niente blocchi neri 2x2, tutte le bianche collegate, serie lunghe al massimo maxLen.
  function runsOf(black, N, dir) {
    const runs = [];
    for (let a = 0; a < N; a++) {
      let s = -1;
      for (let b = 0; b <= N; b++) {
        const w = b < N && !(dir === 0 ? black[a * N + b] : black[b * N + a]);
        if (w && s < 0) s = b;
        if (!w && s >= 0) { runs.push({ a: a, s: s, len: b - s }); s = -1; }
      }
    }
    return runs;
  }
  function valid(black, N, minRun) {
    for (let d = 0; d < 2; d++) { const r = runsOf(black, N, d); for (let i = 0; i < r.length; i++) if (r[i].len < minRun) return false; }
    for (let y = 0; y < N - 1; y++) for (let x = 0; x < N - 1; x++) if (black[y * N + x] && black[y * N + x + 1] && black[(y + 1) * N + x] && black[(y + 1) * N + x + 1]) return false;
    return true;
  }
  function connected(black, N) {
    let start = -1, total = 0;
    for (let i = 0; i < N * N; i++) if (!black[i]) { total++; if (start < 0) start = i; }
    const seen = new Uint8Array(N * N), st = [start]; seen[start] = 1; let c = 0;
    while (st.length) {
      const k = st.pop(); c++; const x = k % N, y = (k - x) / N;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
        const nx = x + d[0], ny = y + d[1]; if (nx < 0 || ny < 0 || nx >= N || ny >= N) return;
        const j = ny * N + nx; if (!black[j] && !seen[j]) { seen[j] = 1; st.push(j); }
      });
    }
    return c === total;
  }
  function makeTemplate(N, opt) {
    const maxLen = opt.maxLen, minRun = opt.minRun || 3, maxBlack = Math.floor(N * N * opt.maxBlackFrac);
    for (let attempt = 0; attempt < 400; attempt++) {
      const black = new Uint8Array(N * N);
      let guard = 0;
      while (guard++ < 200) {
        // serie troppo lunghe
        const longs = [];
        for (let d = 0; d < 2; d++) runsOf(black, N, d).forEach(function (r) { if (r.len > maxLen) longs.push({ d: d, r: r }); });
        if (!longs.length) break;
        const L = longs[rnd(longs.length)], cand = [];
        for (let i = 0; i < L.r.len; i++) cand.push(L.r.s + i);
        shuffle(cand);
        let done = false;
        for (let k = 0; k < cand.length && !done; k++) {
          const p = cand[k], idx = L.d === 0 ? L.r.a * N + p : p * N + L.r.a, sym = N * N - 1 - idx;
          const b2 = black.slice(); b2[idx] = 1; b2[sym] = 1;
          let cnt = 0; for (let i = 0; i < b2.length; i++) cnt += b2[i];
          if (cnt > maxBlack) continue;
          if (valid(b2, N, minRun)) { black.set(b2); done = true; }
        }
        if (!done) break;
      }
      let ok = true;
      for (let d = 0; d < 2; d++) runsOf(black, N, d).forEach(function (r) { if (r.len > maxLen) ok = false; });
      let cnt = 0; for (let i = 0; i < black.length; i++) cnt += black[i];
      if (ok && cnt >= Math.floor(N * N * (opt.minBlackFrac || 0.1)) && cnt <= maxBlack && valid(black, N, minRun) && connected(black, N)) return black;
    }
    return null;
  }


  /* ---------- Schema "libero": ammette caselle non incrociate, mai serie di 2 ---------- */
  function valid2(black, N, mw) {
    mw = mw || 3;
    for (let d = 0; d < 2; d++) { const r = runsOf(black, N, d); for (let i = 0; i < r.length; i++) if (r[i].len >= 2 && r[i].len < mw) return false; }
    for (let y = 0; y < N - 1; y++) for (let x = 0; x < N - 1; x++) if (black[y * N + x] && black[y * N + x + 1] && black[(y + 1) * N + x] && black[(y + 1) * N + x + 1]) return false;
    // ogni casella bianca deve stare in almeno una parola di 3+ lettere
    const inWord = new Uint8Array(N * N);
    for (let d = 0; d < 2; d++) runsOf(black, N, d).forEach(function (r) { if (r.len >= mw) for (let i = 0; i < r.len; i++) inWord[d === 0 ? r.a * N + r.s + i : (r.s + i) * N + r.a] = 1; });
    for (let i = 0; i < N * N; i++) if (!black[i] && !inWord[i]) return false;
    return true;
  }
  function makeTemplate2(N, opt) {
    const target = Math.round(N * N * opt.frac), maxLen = opt.maxLen, mw = opt.minWord || 3;
    for (let attempt = 0; attempt < 300; attempt++) {
      const black = new Uint8Array(N * N); let cnt = 0, guard = 0;
      while (guard++ < 400) {
        let longs = false;
        for (let d = 0; d < 2; d++) runsOf(black, N, d).forEach(function (r) { if (r.len > maxLen) longs = true; });
        if (cnt >= target && !longs) break;
        if (cnt > target + 6) break;
        // scegli una casella a caso (preferibilmente dentro una serie lunga)
        let idx = rnd(N * N);
        if (longs) {
          const L = [];
          for (let d = 0; d < 2; d++) runsOf(black, N, d).forEach(function (r) { if (r.len > maxLen) L.push({ d: d, r: r }); });
          const q = L[rnd(L.length)]; const p = q.r.s + rnd(q.r.len); idx = q.d === 0 ? q.r.a * N + p : p * N + q.r.a;
        }
        const sym = N * N - 1 - idx; if (black[idx]) continue;
        const b2 = black.slice(); b2[idx] = 1; b2[sym] = 1;
        if (valid2(b2, N, mw) && connected(b2, N)) { black.set(b2); cnt = 0; for (let i = 0; i < b2.length; i++) cnt += b2[i]; }
      }
      let ok = valid2(black, N, mw) && connected(black, N);
      for (let d = 0; d < 2; d++) runsOf(black, N, d).forEach(function (r) { if (r.len > maxLen) ok = false; });
      if (ok && cnt >= target - 2) return black;
    }
    return null;
  }

  /* ---------- Parole (slot) ---------- */
  function slotsOf(black, N, mw) {
    mw = mw || 3;
    const slots = [];
    [0, 1].forEach(function (d) {
      runsOf(black, N, d).forEach(function (r) {
        if (r.len < mw) return;
        const cells = [];
        for (let i = 0; i < r.len; i++) cells.push(d === 0 ? r.a * N + r.s + i : (r.s + i) * N + r.a);
        slots.push({ dir: d, cells: cells, len: r.len, row: d === 0 ? r.a : r.s, col: d === 0 ? r.s : r.a });
      });
    });
    return slots;
  }

  /* ---------- Riempimento ---------- */
  // dict: { len: [ [PAROLA, [definizioni]] ] }
  // Ricerca con domini per ogni parola, controllo in avanti e scelta della parola con meno possibilita'.
  function fill(black, N, dict, maxNodes, mw) {
    const slots = slotsOf(black, N, mw), n = slots.length;
    const cellSlots = {};
    slots.forEach(function (s, i) { s.cells.forEach(function (c, k) { (cellSlots[c] = cellSlots[c] || []).push([i, k]); }); });
    const cross = slots.map(function () { return []; });
    slots.forEach(function (s, i) { s.cells.forEach(function (c, k) { cellSlots[c].forEach(function (o) { if (o[0] !== i) cross[i].push({ k: k, o: o[0], ok: o[1] }); }); }); });
    for (let i = 0; i < n; i++) if (!dict[slots[i].len] || !dict[slots[i].len].length) return null;
    const dom = slots.map(function (s) { return shuffle(dict[s.len].map(function (_, i) { return i; })); });
    const asg = new Array(n).fill(-1), used = {};
    let nodes = 0;
    function wordOf(i, idx) { return dict[slots[i].len][idx][0]; }
    function solve() {
      if (++nodes > maxNodes) return false;
      let best = -1, bl = 1e9;
      for (let i = 0; i < n; i++) { if (asg[i] >= 0) continue; if (dom[i].length < bl) { bl = dom[i].length; best = i; if (bl <= 1) break; } }
      if (best < 0) return true;
      if (bl === 0) return false;
      const cand = dom[best].slice(0, 30);
      for (let t = 0; t < cand.length; t++) {
        const idx = cand[t], word = wordOf(best, idx);
        if (used[word]) continue;
        // restringe i domini degli incroci
        const saved = [], okAll = [];
        let dead = false;
        const cr = cross[best];
        for (let q = 0; q < cr.length && !dead; q++) {
          const o = cr[q].o; if (asg[o] >= 0) continue;
          const L = word[cr[q].k], pos = cr[q].ok, arr = dom[o], len = slots[o].len, nd = [];
          for (let z = 0; z < arr.length; z++) { const w2 = dict[len][arr[z]][0]; if (w2[pos] === L && !used[w2] && w2 !== word) nd.push(arr[z]); }
          saved.push([o, arr]); dom[o] = nd;
          if (!nd.length) dead = true;
        }
        if (!dead) {
          asg[best] = idx; used[word] = 1;
          if (solve()) return true;
          asg[best] = -1; used[word] = 0;
        }
        for (let q = saved.length - 1; q >= 0; q--) dom[saved[q][0]] = saved[q][1];
        if (nodes > maxNodes) return false;
      }
      return false;
    }
    if (!solve()) return { fail: true, nodes: nodes };
    const grid = new Array(N * N).fill(''), assign = new Array(n);
    for (let i = 0; i < n; i++) { const e = dict[slots[i].len][asg[i]]; assign[i] = e; slots[i].cells.forEach(function (c, k) { grid[c] = e[0][k]; }); }
    return { slots: slots, assign: assign, grid: grid, nodes: nodes };
  }

  /* ---------- Cruciverba completo ---------- */
  const PRESETS = {
    9: { maxLen: 6, maxBlackFrac: 0.2, minBlackFrac: 0.12 },
    11: { maxLen: 7, maxBlackFrac: 0.2, minBlackFrac: 0.12 },
    13: { maxLen: 8, maxBlackFrac: 0.2, minBlackFrac: 0.12 },
    15: { maxLen: 9, maxBlackFrac: 0.2, minBlackFrac: 0.12 }
  };
  function generate(N, dict, opt) {
    opt = opt || {};
    const preset = Object.assign({}, PRESETS[N], opt.preset || {});
    const tries = opt.tries || 60, maxNodes = opt.maxNodes || 4000;
    let totalNodes = 0, att = 0;
    for (let t = 0; t < tries; t++) {
      const black = makeTemplate(N, preset);
      if (!black) continue;
      att++;
      const r = fill(black, N, dict, maxNodes);
      if (r && !r.fail) { r.black = black; r.N = N; r.attempts = att; r.totalNodes = totalNodes + r.nodes; return r; }
      totalNodes += r ? r.nodes : 0;
    }
    return null;
  }

  const api = { generate: generate, makeTemplate: makeTemplate, makeTemplate2: makeTemplate2, fill: fill, slotsOf: slotsOf, PRESETS: PRESETS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.CWGEN = api;

  worker.onmessage=function(e){
    var m=e.data;
    if(m.prog){ $('busyinfo').textContent='Provo schemi… ('+m.prog+' tentativi)'; return; }
    worker.terminate();worker=null;URL.revokeObjectURL(url);
    if(m.ok){ load(m.res); busy.hidden=true; }
    else { $('busyinfo').textContent='Non riesco con questa misura, provo uno schema più piccolo…'; if(size>9){ setSize(size===13?11:9); } else { busy.hidden=true; statsEl.textContent='Non sono riuscito a generare lo schema, riprova.'; } }
  };
  worker.onerror=function(){ busy.hidden=true; statsEl.textContent='Errore nella generazione, riprova.'; };
  worker.postMessage({N:size,dict:DICT,frac:c.frac,frac0:c.frac,maxLen:c.maxLen,maxNodes:30000,limit:size===13?40000:size===11?25000:15000});
}

/* ---------- caricamento schema ---------- */
function load(r){
  var N=size, black=r.black, slots=r.slots, assign=r.assign;
  // numerazione
  var num=new Array(N*N).fill(0), k=1;
  var startA={},startD={};
  slots.forEach(function(s,i){ var c=s.cells[0]; if(s.dir===0) startA[c]=i; else startD[c]=i; });
  for(var c=0;c<N*N;c++){ if(startA[c]!==undefined||startD[c]!==undefined){ num[c]=k++; } }
  var items=slots.map(function(s,i){
    var defs=assign[i][1]; var def=defs[Math.floor(Math.random()*defs.length)];
    return {dir:s.dir,cells:s.cells,len:s.len,num:num[s.cells[0]],word:assign[i][0],def:def};
  });
  var cellIdx=new Array(N*N);
  for(var i=0;i<N*N;i++) cellIdx[i]=[-1,-1];
  items.forEach(function(it,j){ it.cells.forEach(function(c){ cellIdx[c][it.dir]=j; }); });
  var nb=0; for(var q=0;q<N*N;q++) nb+=black[q]?1:0;
  var words=items.map(function(i){return i.word;});
  var uniq={}; words.forEach(function(w){uniq[w]=1;});
  P={N:N,black:black,items:items,num:num,cellIdx:cellIdx,sol:r.grid,nBlack:nb,tries:r.tries,ms:r.ms};
  letters=new Array(N*N).fill(''); marks=new Array(N*N).fill(''); solved=false; document.body.classList.remove('solved');
  statsEl.textContent=N+'×'+N+' · caselle nere '+Math.round(nb*100/(N*N))+'% ('+nb+') · '+items.length+' parole, tutte diverse · generato in '+(r.ms/1000).toFixed(1)+' s ('+r.tries+' schemi provati)';
  $('printhead').textContent='Cruciverba '+N+'×'+N;
  build();
  // seleziona la prima parola
  var first=0; for(var z=0;z<N*N;z++){ if(!black[z]){ first=z; break; } }
  dir = cellIdx[first][0]>=0?0:1; select(first);
}

function build(){
  var N=P.N;
  gridEl.style.gridTemplateColumns='repeat('+N+',1fr)';
  gridEl.style.gridTemplateRows='repeat('+N+',1fr)';
  gridEl.innerHTML='';
  for(var i=0;i<N*N;i++){
    var d=document.createElement('button');
    d.type='button';
    d.className='cell'+(P.black[i]?' blk':'');
    d.dataset.i=i;
    if(P.black[i]){ d.tabIndex=-1; d.setAttribute('aria-hidden','true'); }
    else{
      d.setAttribute('aria-label','Casella '+(Math.floor(i/N)+1)+','+(i%N+1));
      if(P.num[i]){ var n=document.createElement('span'); n.className='n'; n.textContent=P.num[i]; d.appendChild(n); }
      var l=document.createElement('span'); l.className='l'; d.appendChild(l);
    }
    gridEl.appendChild(d);
  }
  ['across','down'].forEach(function(id,dd){
    var ol=$(id); ol.innerHTML='';
    P.items.map(function(it,j){return j;}).sort(function(a,b){return P.items[a].num-P.items[b].num;}).forEach(function(j){
      var it=P.items[j]; if(it.dir!==dd) return;
      var li=document.createElement('li');
      var b=document.createElement('button'); b.type='button'; b.className='clue'; b.dataset.j=j;
      b.innerHTML='<span class="num">'+it.num+'</span><span>'+esc(it.def)+' <span class="len">('+it.len+')</span></span>';
      li.appendChild(b); ol.appendChild(li);
    });
  });
  paint();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- disegno ---------- */
function curWord(){ if(sel<0) return -1; var j=P.cellIdx[sel][dir]; if(j<0) j=P.cellIdx[sel][1-dir]; return j; }
function paint(){
  var N=P.N, cells=gridEl.children, j=curWord(), inw={};
  if(j>=0) P.items[j].cells.forEach(function(c){inw[c]=1;});
  for(var i=0;i<N*N;i++){
    if(P.black[i]) continue;
    var el=cells[i];
    el.className='cell'+(inw[i]?' inword':'')+(i===sel?' sel':'')+(marks[i]?' '+marks[i]:'');
    el.querySelector('.l').textContent=letters[i];
  }
  // elenco indizi
  document.querySelectorAll('.clue').forEach(function(b){
    var jj=+b.dataset.j, it=P.items[jj];
    var full=it.cells.every(function(c){return letters[c];});
    b.classList.toggle('cur',jj===j);
    b.classList.toggle('done',full);
  });
  if(j>=0){ var it2=P.items[j]; nowEl.innerHTML='<b>'+it2.num+(it2.dir===0?' orizz.':' vert.')+'</b><span>'+esc(it2.def)+' ('+it2.len+')</span>'; }
  else nowEl.innerHTML='<b>—</b><span>Scegli una casella</span>';
}
function select(i){
  if(P.black[i]) return;
  sel=i;
  if(P.cellIdx[i][dir]<0) dir=1-dir;
  paint();
}
function toggleOrSelect(i){
  if(P.black[i]) return;
  if(i===sel){ if(P.cellIdx[i][1-dir]>=0) dir=1-dir; paint(); }
  else select(i);
}

/* ---------- input ---------- */
function stepIn(c,delta){
  // prossima casella nella parola corrente
  var j=P.cellIdx[c][dir]; if(j<0) return c;
  var cells=P.items[j].cells, k=cells.indexOf(c)+delta;
  if(k<0||k>=cells.length) return c;
  return cells[k];
}
function typeLetter(ch){
  if(sel<0||solved) return;
  letters[sel]=ch; marks[sel]='';
  var nx=stepIn(sel,1);
  // salta le caselle gia' riempite solo se ci sono vuote avanti nella parola
  sel=nx; paint(); checkDone();
}
function backspace(){
  if(sel<0||solved) return;
  if(letters[sel]){ letters[sel]=''; marks[sel]=''; }
  else { var pv=stepIn(sel,-1); sel=pv; letters[sel]=''; marks[sel]=''; }
  paint();
}
function move(dx,dy){
  var N=P.N, x=sel%N, y=(sel-x)/N;
  var wantDir = dx!==0?0:1;
  if(wantDir!==dir && P.cellIdx[sel][wantDir]>=0){ dir=wantDir; paint(); return; }
  for(var s=1;s<N;s++){
    var nx=x+dx*s, ny=y+dy*s; if(nx<0||ny<0||nx>=N||ny>=N) return;
    var c=ny*N+nx; if(!P.black[c]){ sel=c; if(P.cellIdx[c][dir]<0) dir=1-dir; paint(); return; }
  }
}
function nextWord(back){
  var j=curWord(), n=P.items.length; if(j<0) return;
  var order=P.items.map(function(_,i){return i;}).sort(function(a,b){ var A=P.items[a],B=P.items[b]; return A.dir-B.dir||A.num-B.num; });
  var p=order.indexOf(j); p=(p+(back?-1:1)+n)%n; var it=P.items[order[p]];
  dir=it.dir; sel=it.cells[0]; paint();
}
gridEl.addEventListener('click',function(e){ var t=e.target.closest('.cell'); if(!t) return; toggleOrSelect(+t.dataset.i); });
document.addEventListener('click',function(e){ var c=e.target.closest('.clue'); if(!c) return; var it=P.items[+c.dataset.j]; dir=it.dir; var empty=it.cells.filter(function(x){return !letters[x];}); sel=empty.length?empty[0]:it.cells[0]; paint(); });
document.addEventListener('keydown',function(e){
  if(!P||e.ctrlKey||e.metaKey||e.altKey) return;
  var k=e.key;
  if(/^[a-zA-Z]$/.test(k)){ e.preventDefault(); typeLetter(k.toUpperCase()); }
  else if(k==='Backspace'||k==='Delete'){ e.preventDefault(); backspace(); }
  else if(k==='ArrowRight'){ e.preventDefault(); move(1,0); }
  else if(k==='ArrowLeft'){ e.preventDefault(); move(-1,0); }
  else if(k==='ArrowDown'){ e.preventDefault(); move(0,1); }
  else if(k==='ArrowUp'){ e.preventDefault(); move(0,-1); }
  else if(k==='Tab'){ e.preventDefault(); nextWord(e.shiftKey); }
  else if(k===' '){ if(e.target.closest&&e.target.closest('.cell')){ e.preventDefault(); toggleOrSelect(sel); } }
});
// tastiera su schermo
(function(){
  var rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'], kb=$('kb');
  rows.forEach(function(r,ri){
    var d=document.createElement('div'); d.className='row';
    r.split('').forEach(function(ch){ var b=document.createElement('button'); b.type='button'; b.className='key'; b.textContent=ch; b.dataset.k=ch; d.appendChild(b); });
    if(ri===2){ var bs=document.createElement('button'); bs.type='button'; bs.className='key wide'; bs.dataset.k='BS'; bs.setAttribute('aria-label','Cancella'); bs.textContent='⌫'; d.appendChild(bs); }
    kb.appendChild(d);
  });
  kb.addEventListener('click',function(e){ var b=e.target.closest('.key'); if(!b) return; if(b.dataset.k==='BS') backspace(); else typeLetter(b.dataset.k); });
})();

/* ---------- comandi ---------- */
function checkDone(){
  var N=P.N, all=true, ok=true;
  for(var i=0;i<N*N;i++){ if(P.black[i]) continue; if(!letters[i]) all=false; else if(letters[i]!==P.sol[i]) ok=false; }
  if(all&&ok){ solved=true; document.body.classList.add('solved'); nowEl.innerHTML='<b>Bravo!</b><span>Cruciverba completato 🎉</span>'; }
  else if(all){ nowEl.innerHTML='<b>Quasi…</b><span>Tutte le caselle sono piene ma qualcosa non torna: prova «Verifica».</span>'; }
}
$('check').onclick=function(){
  var N=P.N, wrong=0;
  for(var i=0;i<N*N;i++){ if(P.black[i]||!letters[i]) continue; if(letters[i]!==P.sol[i]){ marks[i]='bad'; wrong++; } else marks[i]='good'; }
  paint(); nowEl.innerHTML='<b>Verifica</b><span>'+(wrong?wrong+(wrong===1?' lettera sbagliata':' lettere sbagliate')+' (in rosso)':'Tutto giusto finora!')+'</span>';
};
$('hint').onclick=function(){
  if(sel<0||solved) return;
  letters[sel]=P.sol[sel]; marks[sel]='hint'; paint(); checkDone();
};
var solveArm=0;
$('solve').onclick=function(){
  var b=$('solve');
  if(!solveArm){ solveArm=setTimeout(function(){solveArm=0;b.textContent='Soluzione';},3000); b.textContent='Sicuro?'; return; }
  clearTimeout(solveArm); solveArm=0; b.textContent='Soluzione';
  for(var i=0;i<P.N*P.N;i++){ if(!P.black[i]){ letters[i]=P.sol[i]; marks[i]=''; } }
  solved=true; document.body.classList.add('solved'); paint(); nowEl.innerHTML='<b>Soluzione</b><span>Ecco lo schema completo</span>';
};
$('clear').onclick=function(){ letters=letters.map(function(){return '';}); marks=marks.map(function(){return '';}); solved=false; document.body.classList.remove('solved'); paint(); };
$('print').onclick=function(){ window.print(); };
$('new').onclick=newPuzzle;
function setSize(n){
  size=n; try{localStorage.setItem('cw-size',String(n));}catch(e){}
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed', +b.dataset.n===n?'true':'false');});
  newPuzzle();
}
document.querySelectorAll('.seg button').forEach(function(b){ b.onclick=function(){ setSize(+b.dataset.n); }; });
var HH='/giochi'; if(HH) $('home').href=HH; else $('home').style.display='none';
newPuzzle();
})();
</script>
</body>
