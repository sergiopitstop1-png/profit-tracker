<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anagrammi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0b0e1f;--panel:#1b2040;--line:#2d3466;--text:#f4efe4;--muted:#a3a9d4;--amber:#ffb454;
  --tile:#f4efe4;--ink:#161a35;--ok:#6be3a0;--bad:#ff6b6b;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.shell{max-width:560px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.05}
.tag{color:var(--muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
button{font:inherit;color:inherit}
.btn{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;color:inherit;touch-action:manipulation}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:#2a1a05;border-color:var(--amber)}
.btn:focus-visible,.tile:focus-visible,.slot:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:7px 14px;font-weight:800;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--amber);color:#2a1a05}
.info{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;gap:16px;align-items:center}
.clue{text-align:center;font-size:1.15rem;font-weight:800;min-height:2.8em;display:flex;align-items:center;justify-content:center}
.clue small{display:block;color:var(--muted);font-weight:700;font-size:.8rem}
.row{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center}
.slot,.tile{width:min(54px,calc((100vw - 92px)/8));height:min(60px,calc((100vw - 92px)/8*1.15));border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,5.4vw,2rem);padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.slot{background:transparent;border:2px dashed var(--line);color:var(--text);cursor:pointer}
.slot.fill{background:var(--tile);color:var(--ink);border:2px solid var(--tile)}
.slot.hint{background:#ffe3a8;border-color:#ffe3a8;color:var(--ink)}
.tile{background:var(--tile);color:var(--ink);border:0;cursor:pointer;box-shadow:0 3px 0 #9aa0c8}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #9aa0c8}
.tile.used{visibility:hidden}
.row.ok .slot{background:var(--ok);border-color:var(--ok);color:#0a3a20}
.row.bad{animation:shake .4s}
.row.bad .slot{border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{min-height:1.5em;text-align:center;color:var(--muted);font-weight:700}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.end{text-align:center}
.end h2{margin:0;font-family:var(--font-display);color:var(--amber);font-size:1.8rem}
.end .big{font-family:var(--font-display);font-weight:800;font-size:2.4rem}
.end ul{list-style:none;margin:10px 0;padding:0;text-align:left;font-size:.92rem}
.end li{padding:4px 8px;border-bottom:1px solid var(--line)}
.end li b{letter-spacing:.06em}
.end li.miss b{color:var(--bad)}
.end li span{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="tag">Enigmistica</div><h1>Anagrammi</h1></div>
    <a class="btn" href="#" id="home">← Giochi</a>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Livello">
      <button data-l="easy" aria-pressed="true">Facile</button>
      <button data-l="mid" aria-pressed="false">Medio</button>
      <button data-l="hard" aria-pressed="false">Difficile</button>
    </div>
    <button class="btn primary" id="new">Nuova partita</button>
  </div>
  <div id="play">
    <div class="info"><span id="prog"></span><span id="score"></span></div>
    <div class="card" style="margin-top:8px">
      <div class="clue" id="clue"></div>
      <div class="row" id="slots" aria-label="La tua risposta"></div>
      <div class="row" id="tiles" aria-label="Lettere da riordinare"></div>
      <div class="msg" id="msg" aria-live="polite">Riordina le lettere e scrivi la parola.</div>
      <div class="tools">
        <button class="btn" id="shuffle">Mescola</button>
        <button class="btn" id="back">Cancella</button>
        <button class="btn" id="hint">Aiuto (−10)</button>
        <button class="btn" id="skip">Salta</button>
      </div>
    </div>
  </div>
  <div class="card end" id="end" hidden>
    <h2>Partita finita!</h2>
    <div class="big" id="final"></div>
    <div id="summary"></div>
    <ul id="results"></ul>
    <button class="btn primary" id="again">Nuova partita</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};

var ROUNDS=8;
var level='easy'; try{var sl=localStorage.getItem('an-level'); if(LV[sl]) level=sl;}catch(e){}
function key(w){return w.split('').sort().join('');}
var ANA={}, ALL=[]; // lettere ordinate -> parole valide
Object.keys(D).forEach(function(L){ D[L].forEach(function(e){ var k=key(e[0]); (ANA[k]=ANA[k]||[]).push(e[0]); }); });
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var words,idx,score,hints,results,cur,tiles,ans,solved;
function newGame(){
  var pool=[]; for(var L=LV[level].min;L<=LV[level].max;L++) (D[L]||[]).forEach(function(e){ if(new Set(e[0].split('')).size>=3) pool.push(e); });
  shuffle(pool); words=pool.slice(0,ROUNDS);
  idx=0; score=0; results=[]; $('end').hidden=true; $('play').hidden=false; nextWord();
}
function scramble(w){
  var a=w.split(''), s;
  for(var t=0;t<50;t++){ s=shuffle(a.slice()).join(''); if(s!==w&&(ANA[key(w)]||[]).indexOf(s)<0) return s.split(''); }
  return shuffle(a.slice());
}
function nextWord(){
  if(idx>=words.length) return finish();

  $('prog').textContent='Parola '+(idx+1)+' di '+words.length;
  $('score').textContent='Punti: '+score;
  $('clue').innerHTML='<div>'+esc(cur.def)+'<small>'+cur.word.length+' lettere</small></div>';

}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(){
  var sl=$('slots'); sl.innerHTML='';

    var b=document.createElement('button'); b.type='button'; b.className='slot'+(ans[i]!==undefined?' fill':''); b.dataset.p=i;
    if(ans[i]!==undefined){ var t=tiles[ans[i]]; b.textContent=t.ch; if(t.hint) b.classList.add('hint'); b.setAttribute('aria-label','Lettera '+t.ch+', tocca per toglierla'); }
    else b.setAttribute('aria-label','Casella vuota');
    sl.appendChild(b);
  }
  var tl=$('tiles'); tl.innerHTML='';
  tiles.forEach(function(t,i){ var b=document.createElement('button'); b.type='button'; b.className='tile'+(t.used?' used':''); b.dataset.t=i; b.textContent=t.ch; tl.appendChild(b); });
}
function place(ti){
  if(solved) return; var t=tiles[ti]; if(t.used||ans.length>=cur.word.length) return;

}
function removeAt(p){
  if(solved) return; if(ans[p]===undefined) return; var ti=ans[p]; if(tiles[ti].hint) return;

}
function removeLast(){

}
function verify(){

    results.push({word:s,def:cur.def,ok:true,pts:pts});
    setTimeout(function(){idx++;nextWord();},1100);
  } else {
    $('slots').className='row bad'; $('msg').textContent='Non è una parola valida, riprova.'; $('msg').className='msg bad';
    setTimeout(function(){ // toglie le lettere non aiutate
      for(var p=ans.length-1;p>=0;p--){ if(!tiles[ans[p]].hint){ tiles[ans[p]].used=false; ans.splice(p,1); } }
      $('slots').className='row'; render();
    },450);
  }
}
$('tiles').addEventListener('click',function(e){var b=e.target.closest('.tile'); if(b) place(+b.dataset.t);});
$('slots').addEventListener('click',function(e){var b=e.target.closest('.slot'); if(b) removeAt(+b.dataset.p);});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey||$('play').hidden) return;
  var k=e.key;
  if(/^[a-zA-Z]$/.test(k)){ var up=k.toUpperCase(); for(var i=0;i<tiles.length;i++) if(!tiles[i].used&&tiles[i].ch===up){ place(i); break; } }
  else if(k==='Backspace'){ e.preventDefault(); removeLast(); }
  else if(k==='Enter'){ e.preventDefault(); }
});
$('shuffle').onclick=function(){
  if(solved) return;
  // rimescola le tessere non usate mantenendo le usate
  var free=tiles.filter(function(t){return !t.used;}); var chars=shuffle(free.map(function(t){return t.ch;})); var j=0;
  tiles.forEach(function(t){ if(!t.used) t.ch=chars[j++]; }); render();
};
$('back').onclick=removeLast;
$('hint').onclick=function(){
  if(solved) return;
  var w=cur.word, keep=ans.filter(function(i){return tiles[i].hint;});
  if(keep.length>=w.length) return;
  ans.forEach(function(i){ if(!tiles[i].hint) tiles[i].used=false; });
  ans=keep;
  var p=ans.length, found=-1;
  for(var i=0;i<tiles.length;i++) if(!tiles[i].used&&tiles[i].ch===w[p]){found=i;break;}
  if(found<0) return;
  tiles[found].used=true; tiles[found].hint=true; ans.push(found); hints++; render();
  $('msg').textContent='Ti ho messo una lettera giusta.'; $('msg').className='msg';
  if(ans.length===w.length) verify();
};
$('skip').onclick=function(){
  if(solved) return; solved=true;
  results.push({word:cur.word,def:cur.def,ok:false,pts:0});
  $('msg').textContent='Era: '+cur.word; $('msg').className='msg bad';
  setTimeout(function(){idx++;nextWord();},1400);
};
function finish(){
  $('play').hidden=true; $('end').hidden=false;
  var n=results.filter(function(r){return r.ok;}).length, max=words.reduce(function(a,e){return a+e[0].length*10;},0);
  $('final').textContent=score+' punti';
  $('summary').textContent=n+' parole su '+words.length+' indovinate · massimo possibile '+max+' punti';
  var ul=$('results'); ul.innerHTML='';
  results.forEach(function(r){ var li=document.createElement('li'); li.className=r.ok?'':'miss'; li.innerHTML='<b>'+r.word+'</b> <span>'+esc(r.def)+'</span>'; ul.appendChild(li); });
}
$('new').onclick=newGame; $('again').onclick=newGame;
document.querySelectorAll('.seg button').forEach(function(b){
  b.setAttribute('aria-pressed',b.dataset.l===level?'true':'false');
  b.onclick=function(){ level=b.dataset.l; try{localStorage.setItem('an-level',level);}catch(e){} document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.l===level?'true':'false');}); newGame(); };
});
var HH='/giochi'; if(HH) $('home').href=HH; else $('home').style.display='none';
newGame();
})();
</script>
</body>
</html>
